<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Įrašas balsu – Šeimos biudžetas</title>
<meta name="theme-color" content="#3a7f86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root{--bg:#f3f8ef;--fg:#24453f;--muted:#55706a;--accent:#3a7f86;--line:#cfdcc9;--rec:#d9473b}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  h1{font-size:1.3rem;margin:0}
  p{margin:0;color:var(--muted);max-width:340px;line-height:1.45}
  #mic{width:150px;height:150px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
  #mic.on{background:var(--rec);animation:p 1s ease-in-out infinite}
  @keyframes p{0%,100%{box-shadow:0 0 0 0 rgba(217,71,59,.5)}50%{box-shadow:0 0 0 22px rgba(217,71,59,0)}}
  #txt{width:100%;max-width:340px;font-size:18px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--fg)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 20px;font-weight:600;font-size:1rem;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  #st{min-height:1.4em;font-weight:600}
</style>
</head>
<body>
<main>
  <h1>Įrašas balsu</h1>
  <p>Laikykite mygtuką ir sakykite, pvz.: <b>„penkiasdešimt eurų Maxima“</b>. Atleiskite, kai baigsite.</p>
  <button id="mic" type="button" aria-label="Laikykite ir kalbėkite">
    <svg viewBox="0 0 24 24" width="64" height="64" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 1 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H8.5a1 1 0 1 0 0 2h7a1 1 0 1 0 0-2H13v-2.59A6 6 0 0 0 18 11.5Z"/></svg>
  </button>
  <div id="st"></div>
  <input id="txt" placeholder="Čia atsiras pasakytas tekstas" autocomplete="off">
  <div class="row">
    <button class="btn" id="send" type="button">Įrašyti į biudžetą</button>
    <a class="btn ghost" href="https://script.google.com/macros/s/AKfycbxxuoxv7Yc6lSOCY_Lk6ekGq0t6Mxn21Cyl-Yyyk7DtZfHzPLAIxfHqlg2db9dRAIDb/exec">← Į biudžetą</a>
  </div>
</main>
<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbxxuoxv7Yc6lSOCY_Lk6ekGq0t6Mxn21Cyl-Yyyk7DtZfHzPLAIxfHqlg2db9dRAIDb/exec";
  try { var at = new URLSearchParams(location.search).get('atgal'); if (at && /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(at)) { EXEC = at; document.querySelector('a.ghost').href = at; } } catch (_) {}
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var mic = document.getElementById('mic'), st = document.getElementById('st'), txt = document.getElementById('txt');
  var rec = null, on = false, sent = false;
  function send(){ var t = txt.value.trim(); if(!t){ st.textContent = 'Nieko neužrašyta – bandykite dar kartą.'; return; } sent = true; st.textContent = 'Siunčiu į biudžetą…'; location.href = EXEC + '?balsas=' + encodeURIComponent(t); }
  document.getElementById('send').onclick = send;
  if(!SR){ st.textContent = 'Ši naršyklė neatpažįsta balso. Naudokite „Chrome“ arba įrašykite tekstą ranka.'; }
  function start(e){
    e.preventDefault(); if(!SR || on) return;
    try{ mic.setPointerCapture(e.pointerId); }catch(_){}
    rec = new SR(); rec.lang = 'lt-LT'; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(ev){ var t = ''; for(var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript + ' '; txt.value = t.trim(); };
    rec.onerror = function(ev){
      if(ev.error === 'not-allowed' || ev.error === 'service-not-allowed') st.textContent = 'Leiskite naudoti mikrofoną: adreso juostoje paspauskite spynelę → Mikrofonas → Leisti.';
      else if(ev.error === 'no-speech') st.textContent = 'Nieko negirdėjau. Laikykite mygtuką ir kalbėkite.';
      else if(ev.error === 'network') st.textContent = 'Balsui atpažinti reikia interneto.';
    };
    rec.onend = function(){ on = false; mic.classList.remove('on'); if(txt.value.trim() && !sent){ st.textContent = 'Užrašyta! Siunčiu…'; setTimeout(send, 600); } else if(!st.textContent || st.textContent === 'Klausau…') st.textContent = ''; };
    txt.value = ''; st.textContent = 'Klausau…'; on = true; mic.classList.add('on');
    try{ rec.start(); }catch(_){ on = false; mic.classList.remove('on'); }
  }
  function stop(){ if(rec && on){ try{ rec.stop(); }catch(_){} } }
  mic.addEventListener('pointerdown', start);
  mic.addEventListener('pointerup', stop);
  mic.addEventListener('pointercancel', stop);
  mic.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
