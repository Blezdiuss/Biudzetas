<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Šeimos biudžetas</title>
<meta name="theme-color" content="#3a7f86">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Biudžetas">
<style>
  html,body{margin:0;height:100%;background:#f3f8ef;font-family:system-ui,sans-serif;color:#24453f}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;box-sizing:border-box}
  img{width:120px;height:120px}
  a.btn{display:inline-block;background:#3a7f86;color:#fff;text-decoration:none;padding:12px 22px;border-radius:12px;font-weight:600}
  small{max-width:320px;color:#55706a}
</style>
</head>
<body>
<main>
  <img src="ikona-512.png" alt="">
  <div id="tekstas">Atidaroma…</div>
  <a class="btn" id="eiti" href="https://script.google.com/macros/s/AKfycbxxuoxv7Yc6lSOCY_Lk6ekGq0t6Mxn21Cyl-Yyyk7DtZfHzPLAIxfHqlg2db9dRAIDb/exec">Atidaryti biudžetą</a>
  <small id="pagalba">Jei per kelias sekundes neatsidaro, spauskite mygtuką.</small>
</main>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  var idiegta = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (idiegta) {
    setTimeout(function(){ location.href = document.getElementById('eiti').href; }, 300);
  } else {
    document.getElementById('tekstas').textContent = 'Įdiekite: ⋮ → „Įdiegti“. Arba spauskite mygtuką.';
    document.getElementById('pagalba').hidden = true;
  }
</script>
</body>
</html>
